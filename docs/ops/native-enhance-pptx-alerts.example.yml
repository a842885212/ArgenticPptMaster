# Example Prometheus alert rules for native-enhance-pptx (align with rollout thresholds).
# Metric names assume Micrometer Prometheus naming (dots → underscores).

# NativeEnhance-pptx Prometheus alert examples

Version: **2026.08-stage5** — metric names match `NativeEnhancePptxTelemetry`.

```yaml
groups:
  - name: native-enhance-pptx-rollout
    rules:
      - alert: NativeEnhancePptxCreationSuccessRateLow
        expr: |
          (
            sum(rate(native_enhance_pptx_creation_total{outcome="accepted"}[30m]))
            /
            sum(rate(native_enhance_pptx_creation_total[30m]))
          ) < 0.90
          and sum(increase(native_enhance_pptx_creation_total[30m])) >= 20
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: NativeEnhance-pptx creation success rate below rollout block threshold
          runbook_url: docs/ops/native-enhance-pptx-rollout-thresholds.md

      - alert: NativeEnhancePptxAnalysisP95High
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(native_enhance_pptx_stage_duration_seconds_bucket{stage=~"IDENTITY|INTAKE|INVENTORY"}[30m])) by (le)
          ) > 300
          and sum(increase(native_enhance_pptx_stage_total{stage=~"IDENTITY|INTAKE|INVENTORY"}[30m])) >= 15
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: NativeEnhance-pptx analysis P95 latency above block threshold

      - alert: NativeEnhancePptxExportP95High
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(native_enhance_pptx_stage_duration_seconds_bucket{stage="EXPORT"}[30m])) by (le)
          ) > 600
          and sum(increase(native_enhance_pptx_stage_total{stage="EXPORT"}[30m])) >= 10
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: NativeEnhance-pptx export P95 latency above block threshold

      - alert: NativeEnhancePptxStageFailureRateHigh
        expr: |
          (
            sum(rate(native_enhance_pptx_stage_total{outcome="FAILURE"}[30m]))
            /
            sum(rate(native_enhance_pptx_stage_total[30m]))
          ) > 0.10
          and sum(increase(native_enhance_pptx_stage_total[30m])) >= 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: NativeEnhance-pptx stage failure rate elevated

      - alert: NativeEnhancePptxReadbackFailureRateHigh
        expr: |
          (
            sum(rate(native_enhance_pptx_stage_total{stage="READBACK",outcome="FAILURE"}[30m]))
            /
            sum(rate(native_enhance_pptx_stage_total{stage="READBACK"}[30m]))
          ) > 0.15
          and sum(increase(native_enhance_pptx_stage_total{stage="READBACK"}[30m])) >= 10
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: NativeEnhance-pptx read-back failure rate above block threshold

      - alert: NativeEnhancePptxReadbackErrorSpike
        expr: |
          sum(rate(native_enhance_pptx_error_total{error_code="NATIVE_ENHANCE_READBACK_FAILED"}[15m])) > 0.16
          and sum(increase(native_enhance_pptx_error_total{error_code="NATIVE_ENHANCE_READBACK_FAILED"}[15m])) >= 10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Sustained NATIVE_ENHANCE_READBACK_FAILED errors

      - alert: NativeEnhancePptxComplexObjectRateHigh
        expr: |
          (
            sum(rate(native_enhance_pptx_incompatible_total[30m]))
            /
            sum(rate(native_enhance_pptx_stage_total{stage="INVENTORY"}[30m]))
          ) > 0.40
          and sum(increase(native_enhance_pptx_stage_total{stage="INVENTORY"}[30m])) >= 10
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: High complex-object alert rate during inventory

      - alert: NativeEnhancePptxConfirmationRejectRateHigh
        expr: |
          (
            sum(rate(native_enhance_pptx_decision_total{decision="REJECT"}[30m]))
            /
            sum(rate(native_enhance_pptx_decision_total[30m]))
          ) > 0.40
          and sum(increase(native_enhance_pptx_decision_total[30m])) >= 10
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: NativeEnhance-pptx plan confirmation reject rate elevated

      - alert: NativeEnhancePptxRecoveryFailureRateHigh
        expr: |
          (
            sum(rate(native_enhance_pptx_recovery_total{outcome="FAILURE"}[1h]))
            /
            sum(rate(native_enhance_pptx_recovery_total[1h]))
          ) > 0.40
          and sum(increase(native_enhance_pptx_recovery_total[1h])) >= 5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: NativeEnhance-pptx recovery failures elevated

      - alert: NativeEnhancePptxReadinessDown
        expr: |
          max_over_time(
            (spring_health_status{component="native_enhancePptxReadiness"} == 0)[5m:]
          ) >= 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: NativeEnhance-pptx readiness contributor reports DOWN
          runbook_url: docs/ops/native-enhance-pptx-rollout-thresholds.md
```

Notes:

- Micrometer exports counters with dot names converted to underscores in Prometheus (`native_enhance.pptx.creation.total` → `native_enhance_pptx_creation_total`).
- Adjust `spring_health_status` label set to match your Spring Boot Actuator Prometheus scrape config.
- Cleanup safety alerts remain manual until cleanup metrics land; see rollout thresholds doc.
- Do not expand `allowed-tenants` or enable cleanup deletion based on alerts alone — each is an independent ops decision.
