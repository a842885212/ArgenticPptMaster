server.port=8097
spring.application.name=ArgenticPptMaster
ppt-master.repo-path=/home/zhang/PycharmProjects/ppt-master
ppt-master.workspace-path=var/ppt-master
ppt-master.python-command=/media/zhang/E/venvs/ppt-master/bin/python
ppt-master.command-timeout=10m
# Capability-engine dual-run (Python secondary diagnostics; Java is authority).
# Covers structured engines and workspace info/validate (text; mismatch is warn-only,
# dual-run-fail-on-mismatch does not apply to info/validate).
ppt-master.engine.dual-run-enabled=false
ppt-master.engine.dual-run-fail-on-mismatch=false
# Import-sources Python dual-run diagnostics (Java remains authority). Default off.
# When enabled, Python diagnostics write under sources/.dual-run/ and require Python + ppt-master.
ppt-master.engine.import-python-dual-run=false
# System pandoc binary for .doc/.odt/.rtf/.tex/.latex/.rst/.org/.typ → Markdown (default: pandoc).
ppt-master.pandoc-command=pandoc
ppt-master.engine.pandoc-command=pandoc
# IMAGE_ENHANCED Path A 出图网关（服务内 OpenAI 兼容直连，默认生产权威）。
# base-url 必填，且不会回落到 agentscope.base-url：对话代理通常不提供 /images/generations。
# ppt.image.api-key 未配置时回落对话侧 api-key；未开 python-fallback 时不再要求 image_gen.py 存在。
# ppt.image.base-url=https://<openai-compatible-host>/v1
# ppt.image.api-key=${PPT_IMAGE_API_KEY:}
# ppt.image.model=gpt-image-2
# ppt.image.concurrency=5
# ppt.image.item-timeout=180s
# ppt.image.python-fallback=false
# native-enhance 旁白 TTS（服务内 Java Fish Audio；无 python-fallback / 无免费 edge）。
# ppt.audio.fish.api-url=https://api.fish.audio/v1
# ppt.audio.fish.api-key=${PPT_AUDIO_FISH_API_KEY:}
# ppt.audio.fish.model=s2.1-pro-free
# ppt.audio.fish.fallback-model=
# ppt.audio.fish.concurrency=2
# ppt.audio.fish.request-timeout=60s
ppt-master.beautify-pptx.max-source-size=104857600
ppt-master.beautify-pptx.identity-timeout=1m
ppt-master.beautify-pptx.project-timeout=2m
ppt-master.beautify-pptx.intake-timeout=2m
ppt-master.beautify-pptx.inventory-timeout=2m
ppt-master.beautify-pptx.max-concurrent-analyses=2
ppt-master.beautify-pptx.queue-capacity=8
# Beautify production rollout (default closed; actual deletion and diagnostics remain disabled).
ppt-master.beautify-pptx.enabled=false
ppt-master.beautify-pptx.production.cleanup-dry-run-enabled=true
ppt-master.beautify-pptx.production.cleanup-deletion-enabled=false
ppt-master.beautify-pptx.production.diagnostics-enabled=false
ppt-master.beautify-pptx.production.execution-stop-enabled=false
ppt-master.beautify-pptx.production.retention-completed=7d
ppt-master.beautify-pptx.production.retention-failed=14d
ppt-master.beautify-pptx.production.retention-diagnostic=7d
ppt-master.beautify-pptx-cleanup-interval-ms=3600000
ppt-master.native-enhance-pptx.max-source-size=104857600
ppt-master.native-enhance-pptx.init-timeout=3m
ppt-master.native-enhance-pptx.plan-timeout=1m
ppt-master.native-enhance-pptx.validate-timeout=2m
ppt-master.native-enhance-pptx.apply-timeout=5m
ppt-master.native-enhance-pptx.audio-timeout=10m
ppt-master.native-enhance-pptx.max-concurrent-jobs=2
ppt-master.native-enhance-pptx.queue-capacity=8
# Native-enhance production rollout (default closed; actual deletion and diagnostics remain disabled).
ppt-master.native-enhance-pptx.enabled=false
ppt-master.native-enhance-pptx.production.cleanup-dry-run-enabled=true
ppt-master.native-enhance-pptx.production.cleanup-deletion-enabled=false
ppt-master.native-enhance-pptx.production.diagnostics-enabled=false
ppt-master.native-enhance-pptx.production.execution-stop-enabled=false
ppt-master.native-enhance-pptx.production.retention-completed=7d
ppt-master.native-enhance-pptx.production.retention-failed=14d
ppt-master.native-enhance-pptx.production.retention-diagnostic=7d
ppt-master.native-enhance-pptx-cleanup-interval-ms=3600000
# AgentScope 模型配置。
# 支持两种写法：
# 1) 单一模型兼容模式（保留历史字段）：
#    agentscope.provider=openai
#    agentscope.model-name=gpt5.4
#    agentscope.api-key=${OPENAI_API_KEY}
#    agentscope.base-url=http://localhost:4000/v1
# 2) 模型组模式（推荐，支持 fallback）：
#    agentscope.primary.provider=openai
#    agentscope.primary.model-name=gpt5.4
#    agentscope.primary.api-key=${OPENAI_API_KEY}
#    agentscope.primary.base-url=http://localhost:4000/v1
#    agentscope.fallbacks[0].provider=openai
#    agentscope.fallbacks[0].model-name=gpt-4o-mini
#    agentscope.fallbacks[0].api-key=${OPENAI_API_KEY}
#    agentscope.fallbacks[0].base-url=http://localhost:4000/v1
#
# 执行策略（可选）：
# agentscope.execution.max-attempts=3
# agentscope.execution.initial-backoff=1s
# agentscope.execution.max-backoff=10s
# agentscope.execution.timeout=120s
agentscope.provider=openai
agentscope.model-name=kimi-for-coding
agentscope.api-key=sk-NTcsVVM3BUrskvOE9jLUnu349iVL2GxxrHoSUtdz2vjOTP9G
agentscope.base-url=http://127.0.0.1:4000/v1
agentscope.fallbacks[0].provider=openai
agentscope.fallbacks[0].model-name=gemini-3.8-flash
agentscope.fallbacks[0].api-key=sk-NTcsVVM3BUrskvOE9jLUnu349iVL2GxxrHoSUtdz2vjOTP9G
agentscope.fallbacks[0].base-url=http://127.0.0.1:4000/v1

agentscope.max-iters=48
agentscope.session-store-path=var/ppt-master/agent-sessions
agentscope.service-user-id=ppt-master-service
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=300MB
logging.file.name=var/ppt-master/logs/application.log

# Local fixed access context (dev only). Production: enabled=false and use service-auth.
ppt-master.local-access.enabled=true
ppt-master.local-access.subject-id=dev
ppt-master.local-access.tenant-id=dev
ppt-master.local-access.roles=

# Caller service-key auth. Production: enabled=true and inject keys via env.
ppt-master.service-auth.enabled=false
ppt-master.service-auth.clients[0].id=studio
ppt-master.service-auth.clients[0].key=${PPT_SERVICE_KEY_STUDIO:}
ppt-master.service-auth.clients[1].id=script
ppt-master.service-auth.clients[1].key=${PPT_SERVICE_KEY_SCRIPT:}
# Sensitive-mode create allowlists are clientIds (subjectId==tenantId==clientId).
ppt-master.template-fill-allowed-tenants=dev,studio,script
ppt-master.beautify-pptx.allowed-tenants=dev,studio,script
ppt-master.native-enhance-pptx.allowed-tenants=dev,studio,script

# 允许本机 + LAN（99.2 浏览器经 99.1:5175 访问前端时的 Origin）
ppt.web.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://[::1]:*,http://192.168.99.1:*

ppt-master.template-fill-enabled=true
ppt-master.template-fill-production.execution-stop-enabled=false
# Template-fill production rollout (default closed)
ppt-master.template-fill-admin-role=ADMIN
ppt-master.template-fill-production.cleanup-dry-run-enabled=true
ppt-master.template-fill-production.cleanup-deletion-enabled=true
ppt-master.template-fill-production.diagnostics-enabled=true

ppt-master.template-fill-production.retention-completed=7d
ppt-master.template-fill-production.retention-failed=14d
ppt-master.template-fill-production.retention-diagnostic=7d

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true

# 文生图（IMAGE_ENHANCED）— OpenAI 兼容网关，与对话 agentscope.base-url 分离
ppt.image.base-url=http://api.aixoras.com/v1
ppt.image.api-key=sk-sB6rfTDGjUjJlmtzVJmGKmSffblwSYaUEiqhbEejwu5kRGA0
ppt.image.model=gpt-image-2.6-flare
ppt.image.concurrency=5
ppt.image.item-timeout=180s
ppt.image.python-fallback=false

# 旁白 TTS（NATIVE_ENHANCE_PPTX）— Java Fish Audio
ppt.audio.fish.api-url=https://api.fish.audio/v1
ppt.audio.fish.api-key=${PPT_AUDIO_FISH_API_KEY:}
ppt.audio.fish.model=s2.1-pro-free
ppt.audio.fish.fallback-model=
ppt.audio.fish.concurrency=2
ppt.audio.fish.request-timeout=60s
